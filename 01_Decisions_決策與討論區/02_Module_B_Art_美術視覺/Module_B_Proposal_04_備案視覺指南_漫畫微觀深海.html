<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【模組 B 提案 04】三大備案美術視覺概念圖 — 創意與創新</title>
    <style>
        :root {
            --ink: #2D2A26;
            --ink-muted: #6B665F;
            --paper-bg: #FAF6EE;
            --paper-grid: rgba(45, 42, 38, 0.05);
            --card-white: #FFFFFF;
            --butter: #FDE68A;
            --sky: #A8D8F0;
            --mint: #A8E6CF;
            --lavender: #DDD6FE;
            --border-thick: 3.5px solid var(--ink);
            --border-thin: 2.5px solid var(--ink);
            --shadow-sm: 4px 4px 0 var(--ink);
            --shadow-md: 7px 7px 0 var(--ink);
            --font-display: 'Comic Sans MS', 'Balsamiq Sans', 'Chalkboard SE', '微軟正黑體', sans-serif;
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #EFE9DB;
            background-image: linear-gradient(var(--paper-grid) 1.5px, transparent 1.5px), linear-gradient(90deg, var(--paper-grid) 1.5px, transparent 1.5px);
            background-size: 32px 32px;
            font-family: var(--font-body);
            color: var(--ink);
            padding: 40px 20px 80px;
            line-height: 1.6;
        }
        .container { max-width: 960px; margin: 0 auto; }
        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .nav-link {
            background: var(--card-white);
            border: var(--border-thin);
            box-shadow: var(--shadow-sm);
            border-radius: 999px;
            padding: 8px 18px;
            font-family: var(--font-display);
            font-weight: 700;
            text-decoration: none;
            color: var(--ink);
        }
        .sheet {
            background: var(--paper-bg);
            border: var(--border-thick);
            border-radius: 28px;
            box-shadow: var(--shadow-md);
            padding: 48px;
        }
        .badge {
            background: var(--butter);
            border: var(--border-thin);
            box-shadow: 2px 2px 0 var(--ink);
            border-radius: 999px;
            padding: 4px 16px;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 14px;
            display: inline-block;
            margin-bottom: 12px;
        }
        .title { font-family: var(--font-display); font-size: 32px; font-weight: 900; margin-bottom: 20px; }
        .card {
            background: var(--card-white);
            border: var(--border-thick);
            border-radius: 20px;
            box-shadow: var(--shadow-sm);
            padding: 24px;
            margin-bottom: 24px;
        }
        .card-header {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 14px;
            border-bottom: 2px dashed rgba(45,42,38,0.2);
            padding-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="top-nav">
            <a href="../index.html" class="nav-link">← 回到決策中心主頁</a>
            <span style="font-weight: 700; color: var(--ink-muted);">🎨 三大備案美術概念圖</span>
        </nav>
        <main class="sheet">
            <span class="badge">🎨 三大備案美術提案</span>
            <h1 class="title">【三大備案美術】破格漫畫、深海發光粒子與盆栽雙重尺度</h1>

            <!-- 概念圖三合一 -->
            <div style="background: #FFFFFF; border: 2.5px solid var(--ink); border-radius: 18px; padding: 22px; margin-bottom: 24px;">
                <h3 style="font-family: var(--font-display); margin-bottom: 14px; font-size: 18px;">🖼️ 概念視覺速寫：三種截然不同的視覺風格</h3>
                <svg viewBox="0 0 740 210" style="max-width: 100%; height: auto;">
                    <!-- 概念 A：撕開畫框跳出漫畫 -->
                    <g transform="translate(10, 10)">
                        <rect x="0" y="0" width="220" height="170" rx="8" fill="#FFFBEB" stroke="#2D2A26" stroke-width="2.5"/>
                        <!-- 破損的畫布邊緣 -->
                        <path d="M 170 30 L 210 70 L 160 90 L 215 130" fill="none" stroke="#F59E0B" stroke-width="3"/>
                        <circle cx="80" cy="90" r="18" fill="#FFFFFF" stroke="#2D2A26" stroke-width="2.5"/>
                        <!-- 伸出畫格外的手 -->
                        <line x1="98" y1="90" x2="180" y2="80" stroke="#2D2A26" stroke-width="4"/>
                        <text x="110" y="150" font-size="11" font-weight="bold" fill="#B45309" text-anchor="middle">備案一：破畫框喜劇 (Meta UI)</text>
                    </g>

                    <!-- 概念 B：深海幽光流體 -->
                    <g transform="translate(255, 10)">
                        <rect x="0" y="0" width="220" height="170" rx="8" fill="#0B132B" stroke="#2D2A26" stroke-width="2.5"/>
                        <!-- 發光深海粒子與生物巨影 -->
                        <path d="M 20 140 Q 110 90 200 130" fill="none" stroke="#1C2541" stroke-width="24" opacity="0.6"/>
                        <!-- 浮游光點群 -->
                        <circle cx="110" cy="70" r="6" fill="#6FFFE9" opacity="0.9"/>
                        <circle cx="95" cy="85" r="3" fill="#5BC0BE"/>
                        <circle cx="125" cy="80" r="2.5" fill="#5BC0BE"/>
                        <circle cx="140" cy="60" r="4" fill="#6FFFE9" opacity="0.7"/>
                        <text x="110" y="150" font-size="11" font-weight="bold" fill="#6FFFE9" text-anchor="middle">備案二：深海程序發光 (Fluid Glow)</text>
                    </g>

                    <!-- 概念 C：盆栽內外雙重世界 -->
                    <g transform="translate(500, 10)">
                        <rect x="0" y="0" width="220" height="170" rx="8" fill="#FAF5FF" stroke="#2D2A26" stroke-width="2.5"/>
                        <!-- 地表水平線 -->
                        <line x1="10" y1="70" x2="210" y2="70" stroke="#10B981" stroke-width="3"/>
                        <!-- 地表上：一根小綠芽 -->
                        <line x1="110" y1="70" x2="110" y2="45" stroke="#10B981" stroke-width="3"/>
                        <circle cx="115" cy="42" r="5" fill="#34D399"/>
                        <!-- 地表下：繁複無比的根系森林 -->
                        <path d="M 110 70 L 60 120 M 110 70 L 160 125 M 60 120 L 30 145 M 60 120 L 90 140 M 160 125 L 140 150 M 160 125 L 190 145" stroke="#78350F" stroke-width="2.5"/>
                        <text x="110" y="150" font-size="11" font-weight="bold" fill="#047857" text-anchor="middle">備案三：雙重尺度對照 (Macro/Micro)</text>
                    </g>
                </svg>
            </div>

            <section class="card">
                <div class="card-header">🎨 三大備案的美術執行特質分析</div>
                <p>• <strong>備案一（破格喜劇）</strong>：需要繪製多套視覺語言（水墨筆刷、像素、3D 模型），視覺反差極大，趣味性強。</p>
                <p>• <strong>備案二（深海遷徙）</strong>：完全依賴 Canvas / WebGL 粒子與著色器光暈（Bloom），適合追求純粹大氣氛圍感。</p>
                <p>• <strong>備案三（今天不開花）</strong>：外景純手繪生活紙感，地底則是帶景深的微觀森林，製作量最容易收斂掌控、最穩健。</p>
            </section>
        </main>
    </div>
</body>
</html>
