<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【震撼動態原型】期末專案核心視覺概念 3D 互動展示</title>
    <style>
        :root {
            --bg-dark: #080A10;
            --panel-bg: rgba(15, 20, 32, 0.88);
            --panel-border: rgba(255, 255, 255, 0.16);
            --accent-cyan: #38BDF8;
            --accent-gold: #F59E0B;
            --accent-emerald: #10B981;
            --accent-rose: #F43F5E;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
            --font-code: 'JetBrains Mono', Consolas, monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%; height: 100%;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-main);
            overflow: hidden;
            user-select: none;
        }
        #viewport-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            display: block;
            cursor: grab;
        }
        #viewport-canvas:active {
            cursor: grabbing;
        }
        /* 頂部 HUD 導覽列 */
        .hud-header {
            position: absolute;
            top: 20px; left: 24px; right: 24px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            flex-wrap: wrap;
            gap: 12px;
        }
        .brand-title {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(16px);
            border-radius: 999px;
            padding: 8px 22px;
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
        }
        .brand-badge {
            background: linear-gradient(135deg, #0EA5E9, #38BDF8);
            color: #04101A;
            font-size: 11px;
            font-weight: 900;
            padding: 3px 10px;
            border-radius: 999px;
            letter-spacing: 0.5px;
        }
        .brand-text {
            font-size: 14.5px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        /* 切換方案 Tab 膠囊按鈕 */
        .tab-group {
            display: flex;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(16px);
            border-radius: 999px;
            padding: 4px;
            pointer-events: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 20px;
            border-radius: 999px;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, rgba(255,255,255,0.22), rgba(255,255,255,0.08));
            color: #FFF;
            border: 1px solid rgba(255,255,255,0.35);
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
        }
        /* 側邊互動控制台 */
        .control-panel {
            position: absolute;
            bottom: 24px; left: 24px;
            width: 360px;
            max-width: calc(100vw - 48px);
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 22px;
            z-index: 10;
            box-shadow: 0 16px 40px rgba(0,0,0,0.7);
        }
        .panel-title {
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .panel-desc {
            font-size: 12.5px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 16px;
        }
        .control-row {
            margin-bottom: 14px;
        }
        .control-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .range-slider {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.18);
            border-radius: 999px;
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
        }
        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px; height: 18px;
            background: var(--accent-cyan);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 12px var(--accent-cyan);
            transition: transform 0.1s;
        }
        .action-btn-row {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }
        .action-btn {
            flex: 1;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #FFF;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .action-btn:hover {
            background: rgba(255,255,255,0.22);
            border-color: rgba(255,255,255,0.35);
        }
        .action-btn.primary {
            background: linear-gradient(135deg, #0284C7, #38BDF8);
            color: #031422;
            border: none;
            font-weight: 800;
        }
        .action-btn.primary:hover {
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
        }
        /* 右下角視角提示 */
        .camera-tip {
            position: absolute;
            bottom: 24px; right: 24px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(16px);
            border-radius: 999px;
            padding: 8px 18px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .indicator-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #10B981;
            box-shadow: 0 0 8px #10B981;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; }
        }
    </style>
</head>
<body>
    <canvas id="viewport-canvas"></canvas>

    <!-- 頂部 HUD -->
    <div class="hud-header">
        <div class="brand-title">
            <span class="brand-badge">ZERO-DEP 3D</span>
            <span class="brand-text">期末專案·頂級視覺動態原型 (Creative Prototype)</span>
        </div>
        <div class="tab-group">
            <button class="tab-btn active" id="tab-primary-1" onclick="switchScene(1)">
                <span>🔷</span> 主案一：維度撕裂 (2D➔3D)
            </button>
            <button class="tab-btn" id="tab-primary-2" onclick="switchScene(2)">
                <span>🏛️</span> 主案二：時空博物館 (子彈時間)
            </button>
        </div>
    </div>

    <!-- 側邊控制台 -->
    <div class="control-panel" id="control-panel">
        <div id="controls-scene-1">
            <div class="panel-title">
                <span>🔷 主案一：維度形變操控</span>
                <span style="font-size: 11px; color: var(--accent-gold); font-family: var(--font-code);">[Dolly-Zoom]</span>
            </div>
            <p class="panel-desc">拖動滑桿，體驗從極簡無厚度 2D 正交線條，連續過渡至三維立體景深與金屬折射光影！</p>
            
            <div class="control-row">
                <div class="control-label">
                    <span>維度深度 (Z-Dimension & FOV)</span>
                    <span id="label-dimension" style="color: var(--accent-cyan); font-family: var(--font-code);">2D FLAT</span>
                </div>
                <input type="range" class="range-slider" id="slider-dimension" min="0" max="100" value="0" oninput="onDimensionChange(this.value)">
            </div>

            <div class="control-row">
                <div class="control-label">
                    <span>主角飾品物理厚度 (Gold Jewelry)</span>
                    <span id="label-thickness" style="color: var(--accent-gold); font-family: var(--font-code);">2.0 mm</span>
                </div>
                <input type="range" class="range-slider" id="slider-thickness" min="0" max="100" value="20" oninput="onThicknessChange(this.value)">
            </div>

            <div class="action-btn-row">
                <button class="action-btn primary" onclick="triggerDoorJam()">💥 觸發卡在門縫 (Door Jam)</button>
                <button class="action-btn" onclick="resetDimension()">🔄 重置二維</button>
            </div>
        </div>

        <div id="controls-scene-2" style="display: none;">
            <div class="panel-title">
                <span>🏛️ 主案二：時空展品矩陣</span>
                <span style="font-size: 11px; color: var(--accent-cyan); font-family: var(--font-code);">[Bullet Time]</span>
            </div>
            <p class="panel-desc">黑曜石神殿 ✕ 懸浮時空微縮箱。點擊按鈕凍結時間，相機仍可 360 度穿透雨滴穿梭！</p>

            <div class="action-btn-row">
                <button class="action-btn primary" id="btn-freeze" onclick="toggleFreezeTime()">⏸️ 凍結世界 (Bullet Time)</button>
                <button class="action-btn" onclick="triggerBranchExplode()">✨ 重構平行分支</button>
            </div>
        </div>
    </div>

    <!-- 右下角操作提示 -->
    <div class="camera-tip">
        <span class="indicator-dot"></span>
        <span>🖱️ 滑鼠拖曳 360° 繞行 ｜ 滾輪縮放景深</span>
    </div>

    <!-- 100% 純原生零依賴 3D 渲染引擎（無需任何外部 CDN，永不白屏、永不卡死） -->
    <script>
        const canvas = document.getElementById('viewport-canvas');
        const ctx = canvas.getContext('2d');

        let width = 0, height = 0;
        let currentSceneId = 1;

        // 相機視角狀態
        let camRotX = 0, camRotY = 0;
        let camDist = 650;
        let isDragging = false;
        let lastMouseX = 0, lastMouseY = 0;

        // 場景一變數 (2D 轉 3D)
        let dimProgress = 0; // 0 = 2D, 1 = 3D
        let thicknessVal = 0.2;
        let isJamming = false, jamTime = 0;
        let charPosX = -120;
        let sparks = [];

        // 場景二變數 (時空博物館)
        let isTimeFrozen = false;
        let cubeRotation = 0;
        let rainParticles = [];
        let stars = [];
        let explodeScale = 1;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 初始化背景粒子與星群
        for (let i = 0; i < 400; i++) {
            stars.push({
                x: (Math.random() - 0.5) * 1600,
                y: (Math.random() - 0.5) * 1200,
                z: (Math.random() - 0.5) * 1600,
                size: Math.random() * 2 + 0.8,
                color: Math.random() > 0.4 ? '#38BDF8' : '#F59E0B'
            });
        }
        // 初始化凍結雨滴 (場景二)
        for (let i = 0; i < 200; i++) {
            rainParticles.push({
                x: -180 + (Math.random() - 0.5) * 180,
                y: (Math.random() - 0.5) * 180,
                z: (Math.random() - 0.5) * 180,
                speed: Math.random() * 4 + 2
            });
        }

        // 滑鼠與觸控相機監聽
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - lastMouseX;
            const dy = e.clientY - lastMouseY;
            camRotY += dx * 0.007;
            camRotX = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, camRotX + dy * 0.007));
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });
        window.addEventListener('mouseup', () => { isDragging = false; });
        canvas.addEventListener('wheel', (e) => {
            camDist = Math.max(300, Math.min(1400, camDist + e.deltaY * 0.6));
        }, { passive: true });

        // 觸控支援
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            }
        });
        window.addEventListener('touchmove', (e) => {
            if (!isDragging || e.touches.length !== 1) return;
            const dx = e.touches[0].clientX - lastMouseX;
            const dy = e.touches[0].clientY - lastMouseY;
            camRotY += dx * 0.008;
            camRotX = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, camRotX + dy * 0.008));
            lastMouseX = e.touches[0].clientX;
            lastMouseY = e.touches[0].clientY;
        });
        window.addEventListener('touchend', () => { isDragging = false; });

        // 3D 投影核心數學公式
        function project3D(x, y, z) {
            // Y 軸旋轉
            let cosY = Math.cos(camRotY), sinY = Math.sin(camRotY);
            let x1 = x * cosY - z * sinY;
            let z1 = z * cosY + x * sinY;

            // X 軸旋轉
            let cosX = Math.cos(camRotX), sinX = Math.sin(camRotX);
            let y2 = y * cosX - z1 * sinX;
            let z2 = z1 * cosX + y * sinX;

            let z_cam = z2 + camDist;
            if (z_cam <= 10) return null; // 裁切面後

            let scale = 600 / z_cam;
            return {
                x: width / 2 + x1 * scale,
                y: height / 2 + y2 * scale,
                scale: scale,
                depth: z_cam
            };
        }

        /* -------------------------------------------------------------
           繪製場景一：2D 轉 3D 維度撕裂
        ------------------------------------------------------------- */
        function renderScene1(delta) {
            // 背景漸層
            let bgGrad = ctx.createRadialGradient(width/2, height/2, 50, width/2, height/2, width*0.8);
            bgGrad.addColorStop(0, '#101626');
            bgGrad.addColorStop(1, '#080A10');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            // 繪製地平網格 (隨維度拉開傾斜)
            ctx.strokeStyle = `rgba(56, 189, 248, ${0.15 + dimProgress * 0.25})`;
            ctx.lineWidth = 1;
            let gridY = 80;
            let gridAngle = (1 - dimProgress) * (Math.PI / 2); // 0 = 平放, PI/2 = 正交貼平

            for (let i = -6; i <= 6; i++) {
                let p1 = project3D(i * 45, gridY * Math.cos(gridAngle), i * 45 * Math.sin(gridAngle) - 200);
                let p2 = project3D(i * 45, gridY * Math.cos(gridAngle), i * 45 * Math.sin(gridAngle) + 200);
                if (p1 && p2) {
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.stroke();
                }
            }
            for (let j = -5; j <= 5; j++) {
                let p1 = project3D(-270, gridY * Math.cos(gridAngle), j * 40 * dimProgress);
                let p2 = project3D(270, gridY * Math.cos(gridAngle), j * 40 * dimProgress);
                if (p1 && p2) {
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.stroke();
                }
            }

            // 門縫紅光裂隙
            let doorP1 = project3D(140, -180, 0);
            let doorP2 = project3D(140, 180, 0);
            if (doorP1 && doorP2) {
                ctx.save();
                ctx.strokeStyle = '#F43F5E';
                ctx.lineWidth = 4;
                ctx.shadowColor = '#F43F5E';
                ctx.shadowBlur = 18;
                ctx.beginPath();
                ctx.moveTo(doorP1.x, doorP1.y);
                ctx.lineTo(doorP2.x, doorP2.y);
                ctx.stroke();
                ctx.restore();
            }

            // 主角位置計算 (處理卡門抖動)
            let curCharX = charPosX;
            if (isJamming) {
                jamTime += delta;
                curCharX = 115 + Math.sin(jamTime * 50) * 8;
                // 生成碰撞粒子火花
                if (Math.random() > 0.3) {
                    sparks.push({
                        x: 135,
                        y: (Math.random() - 0.5) * 60,
                        z: (Math.random() - 0.5) * 40,
                        vx: -(Math.random() * 4 + 2),
                        vy: (Math.random() - 0.5) * 6,
                        vz: (Math.random() - 0.5) * 6,
                        life: 1.0
                    });
                }
                if (jamTime > 2.5) isJamming = false;
            }

            // 繪製主角立方體 (帶有 3D 深度與光照)
            let boxSize = 55;
            let boxDepth = 5 + dimProgress * 50; // 2D 時厚度為 5，3D 時拉開到 55
            drawShadedBox(curCharX, 0, 0, boxSize, boxSize, boxDepth, '#FFFFFF');

            // 繪製金色厚重飾品 (旋轉環)
            let jewRadius = 45 * (0.8 + thicknessVal * 1.2);
            let jewThick = 8 + thicknessVal * 28 * dimProgress;
            drawGoldRing(curCharX, 0, 0, jewRadius, jewThick, delta);

            // 繪製火花粒子
            for (let i = sparks.length - 1; i >= 0; i--) {
                let sp = sparks[i];
                sp.x += sp.vx; sp.y += sp.vy; sp.z += sp.vz;
                sp.life -= delta * 1.5;
                if (sp.life <= 0) {
                    sparks.splice(i, 1);
                    continue;
                }
                let pt = project3D(sp.x, sp.y, sp.z);
                if (pt) {
                    ctx.fillStyle = `rgba(253, 230, 138, ${sp.life})`;
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, 2.5 * pt.scale, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        // 繪製帶有光照與深度的 3D 方塊
        function drawShadedBox(cx, cy, cz, sx, sy, sz, baseColor) {
            let hx = sx / 2, hy = sy / 2, hz = sz / 2;
            let vertices = [
                {x: cx - hx, y: cy - hy, z: cz - hz},
                {x: cx + hx, y: cy - hy, z: cz - hz},
                {x: cx + hx, y: cy + hy, z: cz - hz},
                {x: cx - hx, y: cy + hy, z: cz - hz},
                {x: cx - hx, y: cy - hy, z: cz + hz},
                {x: cx + hx, y: cy - hy, z: cz + hz},
                {x: cx + hx, y: cy + hy, z: cz + hz},
                {x: cx - hx, y: cy + hy, z: cz + hz}
            ];

            let faces = [
                {v: [0, 1, 2, 3], norm: {x: 0, y: 0, z: -1}}, // 前
                {v: [5, 4, 7, 6], norm: {x: 0, y: 0, z: 1}},  // 後
                {v: [4, 0, 3, 7], norm: {x: -1, y: 0, z: 0}}, // 左
                {v: [1, 5, 6, 2], norm: {x: 1, y: 0, z: 0}},  // 右
                {v: [4, 5, 1, 0], norm: {x: 0, y: -1, z: 0}}, // 上
                {v: [3, 2, 6, 7], norm: {x: 0, y: 1, z: 0}}   // 下
            ];

            // 投影頂點
            let projVerts = vertices.map(v => project3D(v.x, v.y, v.z));

            // 計算面中心深度並由深到淺排序
            faces.forEach(f => {
                let p0 = projVerts[f.v[0]], p1 = projVerts[f.v[1]], p2 = projVerts[f.v[2]], p3 = projVerts[f.v[3]];
                f.depth = (p0 && p1 && p2 && p3) ? (p0.depth + p1.depth + p2.depth + p3.depth) / 4 : 0;
            });
            faces.sort((a, b) => b.depth - a.depth);

            // 光源方向 (固定在斜上方)
            let lx = 0.5, ly = -0.7, lz = 0.5;

            faces.forEach(f => {
                let pts = [projVerts[f.v[0]], projVerts[f.v[1]], projVerts[f.v[2]], projVerts[f.v[3]]];
                if (pts.some(p => p === null)) return;

                // 背面剔除 (Backface Culling)
                let cross = (pts[1].x - pts[0].x) * (pts[2].y - pts[0].y) - (pts[1].y - pts[0].y) * (pts[2].x - pts[0].x);
                if (cross <= 0) return;

                // 光照強度
                let dot = Math.max(0.15, (f.norm.x * lx + f.norm.y * ly + f.norm.z * lz));
                let shade = Math.floor(200 + dot * 55);

                ctx.fillStyle = `rgb(${shade}, ${shade}, ${shade})`;
                ctx.strokeStyle = '#2D2A26';
                ctx.lineWidth = 2.5;

                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                ctx.lineTo(pts[1].x, pts[1].y);
                ctx.lineTo(pts[2].x, pts[2].y);
                ctx.lineTo(pts[3].x, pts[3].y);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            });
        }

        // 繪製金色立體飾品
        let ringRot = 0;
        function drawGoldRing(cx, cy, cz, radius, thick, delta) {
            ringRot += delta * 1.2;
            let segments = 24;
            ctx.save();
            ctx.strokeStyle = '#F59E0B';
            ctx.shadowColor = '#F59E0B';
            ctx.shadowBlur = 14 * dimProgress;
            ctx.lineWidth = thick * (dimProgress * 0.8 + 0.2);

            let firstPt = null;
            ctx.beginPath();
            for (let i = 0; i <= segments; i++) {
                let theta = (i / segments) * Math.PI * 2;
                let rx = Math.cos(theta) * radius;
                let rz = Math.sin(theta) * radius * dimProgress;
                let ry = Math.sin(theta + ringRot) * (18 * dimProgress);

                let pt = project3D(cx + rx, cy + ry, cz + rz);
                if (pt) {
                    if (i === 0) {
                        ctx.moveTo(pt.x, pt.y);
                        firstPt = pt;
                    } else {
                        ctx.lineTo(pt.x, pt.y);
                    }
                }
            }
            ctx.stroke();
            ctx.restore();
        }

        /* -------------------------------------------------------------
           繪製場景二：時空博物館 (神殿 ✕ 微縮箱 ✕ 子彈時間)
        ------------------------------------------------------------- */
        function renderScene2(delta) {
            // 黑曜石神殿深空
            ctx.fillStyle = '#07090E';
            ctx.fillRect(0, 0, width, height);

            if (!isTimeFrozen) {
                cubeRotation += delta * 0.6;
            }

            // 繪製背景星雲粒子
            stars.forEach(s => {
                let pt = project3D(s.x, s.y, s.z);
                if (pt) {
                    ctx.fillStyle = s.color;
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, s.size * pt.scale, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // 兩座光柱地面光暈
            let floorP1 = project3D(-180, 140, 0);
            let floorP2 = project3D(180, 140, 0);
            if (floorP1) {
                let g1 = ctx.createRadialGradient(floorP1.x, floorP1.y, 10, floorP1.x, floorP1.y, 120);
                g1.addColorStop(0, 'rgba(56, 189, 248, 0.35)');
                g1.addColorStop(1, 'transparent');
                ctx.fillStyle = g1;
                ctx.fillRect(floorP1.x - 120, floorP1.y - 120, 240, 240);
            }
            if (floorP2) {
                let g2 = ctx.createRadialGradient(floorP2.x, floorP2.y, 10, floorP2.x, floorP2.y, 120);
                g2.addColorStop(0, 'rgba(52, 211, 153, 0.35)');
                g2.addColorStop(1, 'transparent');
                ctx.fillStyle = g2;
                ctx.fillRect(floorP2.x - 120, floorP2.y - 120, 240, 240);
            }

            // 繪製懸浮微縮箱 A (紅色災難停滯)
            drawWireframeDiorama(-180, 0, 0, 140, cubeRotation, '#F87171', '【展品 A：代價延宕】');

            // 繪製懸浮微縮箱 B (綠色生機分支)
            drawWireframeDiorama(180, 0, 0, 140 * explodeScale, -cubeRotation, '#34D399', '【展品 B：及時承擔】');

            // 繪製凍結雨滴 (子彈時間)
            rainParticles.forEach(r => {
                if (!isTimeFrozen) {
                    r.y += r.speed;
                    if (r.y > 90) r.y = -90;
                }
                let pt = project3D(r.x, r.y, r.z);
                if (pt) {
                    ctx.fillStyle = isTimeFrozen ? '#60A5FA' : '#93C5FD';
                    ctx.fillRect(pt.x, pt.y, 2 * pt.scale, 7 * pt.scale);
                }
            });
        }

        // 繪製透明時空微縮箱
        function drawWireframeDiorama(cx, cy, cz, size, rot, color, title) {
            let hs = size / 2;
            let rawVerts = [
                {x: -hs, y: -hs, z: -hs}, {x: hs, y: -hs, z: -hs},
                {x: hs, y: hs, z: -hs},   {x: -hs, y: hs, z: -hs},
                {x: -hs, y: -hs, z: hs},  {x: hs, y: -hs, z: hs},
                {x: hs, y: hs, z: hs},    {x: -hs, y: hs, z: hs}
            ];

            let cos = Math.cos(rot), sin = Math.sin(rot);
            let rotatedVerts = rawVerts.map(v => {
                return {
                    x: cx + (v.x * cos - v.z * sin),
                    y: cy + v.y,
                    z: cz + (v.z * cos + v.x * sin)
                };
            });

            let pts = rotatedVerts.map(v => project3D(v.x, v.y, v.z));
            let edges = [
                [0,1],[1,2],[2,3],[3,0],
                [4,5],[5,6],[6,7],[7,4],
                [0,4],[1,5],[2,6],[3,7]
            ];

            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.shadowColor = color;
            ctx.shadowBlur = 10;

            edges.forEach(([i, j]) => {
                if (pts[i] && pts[j]) {
                    ctx.beginPath();
                    ctx.moveTo(pts[i].x, pts[i].y);
                    ctx.lineTo(pts[j].x, pts[j].y);
                    ctx.stroke();
                }
            });

            // 繪製箱內幾何核心
            let centerPt = project3D(cx, cy, cz);
            if (centerPt) {
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(centerPt.x, centerPt.y, 8 * centerPt.scale, 0, Math.PI * 2);
                ctx.fill();

                // 標題文字
                ctx.font = 'bold 12px sans-serif';
                ctx.fillStyle = color;
                ctx.textAlign = 'center';
                ctx.fillText(title, centerPt.x, centerPt.y + 90 * centerPt.scale);
            }
            ctx.restore();
        }

        /* -------------------------------------------------------------
           控制台互動事件
        ------------------------------------------------------------- */
        function switchScene(id) {
            currentSceneId = id;
            if (id === 1) {
                document.getElementById('tab-primary-1').classList.add('active');
                document.getElementById('tab-primary-2').classList.remove('active');
                document.getElementById('controls-scene-1').style.display = 'block';
                document.getElementById('controls-scene-2').style.display = 'none';
                camRotX = 0; camRotY = 0; camDist = 650;
            } else {
                document.getElementById('tab-primary-1').classList.remove('active');
                document.getElementById('tab-primary-2').classList.add('active');
                document.getElementById('controls-scene-1').style.display = 'none';
                document.getElementById('controls-scene-2').style.display = 'block';
                camRotX = 0.2; camRotY = 0.35; camDist = 720;
            }
        }

        function onDimensionChange(val) {
            dimProgress = val / 100;
            const label = document.getElementById('label-dimension');
            if (dimProgress === 0) {
                label.innerText = '2D FLAT (無透視)';
                label.style.color = '#94A3B8';
                camRotX = 0; camRotY = 0;
            } else if (dimProgress < 1) {
                label.innerText = `MORPHING: ${(dimProgress * 100).toFixed(0)}%`;
                label.style.color = 'var(--accent-cyan)';
            } else {
                label.innerText = '3D FULL PERSPECTIVE';
                label.style.color = 'var(--accent-gold)';
            }
        }

        function onThicknessChange(val) {
            thicknessVal = val / 100;
            document.getElementById('label-thickness').innerText = `${(val * 0.1).toFixed(1)} mm`;
        }

        function triggerDoorJam() {
            isJamming = true;
            jamTime = 0;
        }

        function resetDimension() {
            document.getElementById('slider-dimension').value = 0;
            onDimensionChange(0);
            charPosX = -120;
            isJamming = false;
        }

        function toggleFreezeTime() {
            isTimeFrozen = !isTimeFrozen;
            const btn = document.getElementById('btn-freeze');
            if (isTimeFrozen) {
                btn.innerText = '▶️ 恢復流動 (Resume)';
                btn.style.background = '#10B981';
            } else {
                btn.innerText = '⏸️ 凍結世界 (Bullet Time)';
                btn.style.background = 'linear-gradient(135deg, #0284C7, #38BDF8)';
            }
        }

        function triggerBranchExplode() {
            explodeScale = 1.8;
            let timer = setInterval(() => {
                explodeScale -= 0.05;
                if (explodeScale <= 1.0) {
                    explodeScale = 1.0;
                    clearInterval(timer);
                }
            }, 30);
        }

        // 60FPS 動畫主迴圈
        let lastTime = performance.now();
        function loop(now) {
            let delta = Math.min(0.1, (now - lastTime) / 1000);
            lastTime = now;

            if (currentSceneId === 1) {
                renderScene1(delta);
            } else {
                renderScene2(delta);
            }

            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    </script>
</body>
