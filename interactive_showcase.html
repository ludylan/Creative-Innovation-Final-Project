<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【震撼動態原型】期末專案核心視覺概念 3D 互動展示</title>
    <style>
        :root {
            --bg-dark: #090B10;
            --panel-bg: rgba(18, 22, 34, 0.82);
            --panel-border: rgba(255, 255, 255, 0.15);
            --accent-cyan: #38BDF8;
            --accent-gold: #F59E0B;
            --accent-emerald: #10B981;
            --accent-rose: #F43F5E;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
            --font-code: 'JetBrains Mono', Consolas, monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%; height: 100%;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-main);
            overflow: hidden;
            user-select: none;
        }
        #webgl-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            display: block;
            cursor: grab;
        }
        #webgl-canvas:active {
            cursor: grabbing;
        }
        /* 頂部 HUD 導覽列 */
        .hud-header {
            position: absolute;
            top: 20px; left: 24px; right: 24px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            flex-wrap: wrap;
            gap: 12px;
        }
        .brand-title {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(16px);
            border-radius: 999px;
            padding: 8px 22px;
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .brand-badge {
            background: linear-gradient(135deg, #0EA5E9, #38BDF8);
            color: #04101A;
            font-size: 11px;
            font-weight: 900;
            padding: 3px 10px;
            border-radius: 999px;
            letter-spacing: 0.5px;
        }
        .brand-text {
            font-size: 14.5px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        /* 切換方案 Tab 膠囊按鈕 */
        .tab-group {
            display: flex;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(16px);
            border-radius: 999px;
            padding: 4px;
            pointer-events: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 20px;
            border-radius: 999px;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0.08));
            color: #FFF;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }
        /* 側邊互動控制台 */
        .control-panel {
            position: absolute;
            bottom: 24px; left: 24px;
            width: 360px;
            max-width: calc(100vw - 48px);
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 22px;
            z-index: 10;
            box-shadow: 0 16px 40px rgba(0,0,0,0.6);
        }
        .panel-title {
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .panel-desc {
            font-size: 12.5px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 16px;
        }
        .control-row {
            margin-bottom: 14px;
        }
        .control-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .range-slider {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.15);
            border-radius: 999px;
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
        }
        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px; height: 18px;
            background: var(--accent-cyan);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 12px var(--accent-cyan);
            transition: transform 0.1s;
        }
        .action-btn-row {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }
        .action-btn {
            flex: 1;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #FFF;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .action-btn:hover {
            background: rgba(255,255,255,0.22);
            border-color: rgba(255,255,255,0.35);
        }
        .action-btn.primary {
            background: linear-gradient(135deg, #0284C7, #38BDF8);
            color: #031422;
            border: none;
            font-weight: 800;
        }
        .action-btn.primary:hover {
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
        }
        /* 右下角視角提示 */
        .camera-tip {
            position: absolute;
            bottom: 24px; right: 24px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(16px);
            border-radius: 999px;
            padding: 8px 18px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .indicator-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #10B981;
            box-shadow: 0 0 8px #10B981;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; }
        }
        #loading-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-cyan);
            background: rgba(9, 11, 16, 0.85);
            padding: 12px 24px;
            border-radius: 999px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            pointer-events: none;
            transition: opacity 0.4s;
        }
    </style>
    <!-- 單一依賴源：Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="loading-overlay">⚡ 3D 渲染核心初始化中...</div>
    <canvas id="webgl-canvas"></canvas>

    <!-- 頂部 HUD -->
    <div class="hud-header">
        <div class="brand-title">
            <span class="brand-badge">LIVE 3D</span>
            <span class="brand-text">期末專案·頂級視覺動態原型 (Creative Prototype)</span>
        </div>
        <div class="tab-group">
            <button class="tab-btn active" id="tab-primary-1" onclick="switchScene(1)">
                <span>🔷</span> 主案一：維度撕裂 (2D➔3D)
            </button>
            <button class="tab-btn" id="tab-primary-2" onclick="switchScene(2)">
                <span>🏛️</span> 主案二：時空博物館 (子彈時間)
            </button>
        </div>
    </div>

    <!-- 側邊控制台 -->
    <div class="control-panel" id="control-panel">
        <div id="controls-scene-1">
            <div class="panel-title">
                <span>🔷 主案一：維度形變操控</span>
                <span style="font-size: 11px; color: var(--accent-gold); font-family: var(--font-code);">[Dolly-Zoom]</span>
            </div>
            <p class="panel-desc">拖動滑桿，體驗從極簡無厚度 2D 正交線條，連續過渡至三維立體景深與金屬折射光影！</p>
            
            <div class="control-row">
                <div class="control-label">
                    <span>維度深度 (Z-Dimension & FOV)</span>
                    <span id="label-dimension" style="color: var(--accent-cyan); font-family: var(--font-code);">2D FLAT</span>
                </div>
                <input type="range" class="range-slider" id="slider-dimension" min="0" max="100" value="0" oninput="onDimensionChange(this.value)">
            </div>

            <div class="control-row">
                <div class="control-label">
                    <span>主角飾品物理厚度 (Gold Jewelry)</span>
                    <span id="label-thickness" style="color: var(--accent-gold); font-family: var(--font-code);">2.0 mm</span>
                </div>
                <input type="range" class="range-slider" id="slider-thickness" min="0" max="100" value="20" oninput="onThicknessChange(this.value)">
            </div>

            <div class="action-btn-row">
                <button class="action-btn primary" onclick="triggerDoorJam()">💥 觸發卡在門縫 (Door Jam)</button>
                <button class="action-btn" onclick="resetDimension()">🔄 重置二維</button>
            </div>
        </div>

        <div id="controls-scene-2" style="display: none;">
            <div class="panel-title">
                <span>🏛️ 主案二：時空展品矩陣</span>
                <span style="font-size: 11px; color: var(--accent-cyan); font-family: var(--font-code);">[Bullet Time]</span>
            </div>
            <p class="panel-desc">黑曜石神殿 ✕ 懸浮時空微縮箱。點擊按鈕凍結時間，相機仍可 360 度穿透雨滴穿梭！</p>

            <div class="action-btn-row">
                <button class="action-btn primary" id="btn-freeze" onclick="toggleFreezeTime()">⏸️ 凍結世界 (Bullet Time)</button>
                <button class="action-btn" onclick="triggerBranchExplode()">✨ 重構平行分支</button>
            </div>
        </div>
    </div>

    <!-- 右下角操作提示 -->
    <div class="camera-tip">
        <span class="indicator-dot"></span>
        <span>🖱️ 滑鼠拖曳 360° 繞行 ｜ 滾輪縮放景深</span>
    </div>

    <script>
        // 核心渲染器與場景變數
        let scene, camera, renderer;
        let currentSceneId = 1;
        let clock;
        let isThreeReady = false;

        // 自製純零依賴相機軌道控制器 (完全免去 OrbitControls.js 跨域載入失敗問題)
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let spherical = { radius: 14, theta: 0, phi: Math.PI / 2 };

        // 場景一物件 (2D 轉 3D)
        let groupScene1;
        let flatGrid, charMesh, jewelryMesh, doorFrame, particleSystem1;
        let dimProgress = 0;
        let isJamming = false, jamTime = 0;

        // 場景二物件 (時空博物館)
        let groupScene2;
        let dioramaA, dioramaB, rainParticles, swarmParticles;
        let isTimeFrozen = false;

        function bootstrap() {
            if (typeof THREE === 'undefined') {
                setTimeout(bootstrap, 100);
                return;
            }
            isThreeReady = true;
            document.getElementById('loading-overlay').style.opacity = '0';
            setTimeout(() => {
                const overlay = document.getElementById('loading-overlay');
                if (overlay) overlay.style.display = 'none';
            }, 400);

            initThreeScene();
            animate();
        }

        function initThreeScene() {
            clock = new THREE.Clock();
            const canvas = document.getElementById('webgl-canvas');
            
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x090B10);
            scene.fog = new THREE.FogExp2(0x090B10, 0.035);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            updateCameraPosition();

            groupScene1 = new THREE.Group();
            groupScene2 = new THREE.Group();
            scene.add(groupScene1);
            scene.add(groupScene2);

            buildScene1();
            buildScene2();
            switchScene(1);

            // 綁定原生滑鼠相機控制
            canvas.addEventListener('mousedown', (e) => {
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });
            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;
                spherical.theta -= deltaX * 0.007;
                spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi - deltaY * 0.007));
                updateCameraPosition();
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });
            window.addEventListener('mouseup', () => { isDragging = false; });
            canvas.addEventListener('wheel', (e) => {
                spherical.radius = Math.max(5, Math.min(28, spherical.radius + e.deltaY * 0.015));
                updateCameraPosition();
            }, { passive: true });

            // 觸控支援
            canvas.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isDragging = true;
                    previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                }
            });
            window.addEventListener('touchmove', (e) => {
                if (!isDragging || e.touches.length !== 1) return;
                const deltaX = e.touches[0].clientX - previousMousePosition.x;
                const deltaY = e.touches[0].clientY - previousMousePosition.y;
                spherical.theta -= deltaX * 0.008;
                spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi - deltaY * 0.008));
                updateCameraPosition();
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            });
            window.addEventListener('touchend', () => { isDragging = false; });

            window.addEventListener('resize', onWindowResize);
        }

        function updateCameraPosition() {
            camera.position.x = spherical.radius * Math.sin(spherical.phi) * Math.sin(spherical.theta);
            camera.position.y = spherical.radius * Math.cos(spherical.phi);
            camera.position.z = spherical.radius * Math.sin(spherical.phi) * Math.cos(spherical.theta);
            camera.lookAt(0, 0, 0);
        }

        /* -------------------------------------------------------------
           場景一：2D 轉 3D 維度撕裂
        ------------------------------------------------------------- */
        function buildScene1() {
            const ambLight = new THREE.AmbientLight(0xFFFFFF, 0.5);
            groupScene1.add(ambLight);

            const dirLight = new THREE.DirectionalLight(0xFDE68A, 1.4);
            dirLight.position.set(6, 10, 8);
            groupScene1.add(dirLight);

            // 2D 網格背景
            flatGrid = new THREE.GridHelper(18, 18, 0x38BDF8, 0x1E293B);
            flatGrid.rotation.x = Math.PI / 2;
            groupScene1.add(flatGrid);

            // 主角白塊幾何
            const charGeo = new THREE.BoxGeometry(1.6, 1.6, 1.6);
            const charMat = new THREE.MeshStandardMaterial({
                color: 0xFFFFFF,
                roughness: 0.15,
                metalness: 0.2
            });
            charMesh = new THREE.Mesh(charGeo, charMat);
            charMesh.position.set(-2, 0, 0);
            charMesh.scale.z = 0.05; // 初始完全扁平 2D
            groupScene1.add(charMesh);

            // 穿戴之厚重立體金飾
            const jewGeo = new THREE.TorusKnotGeometry(0.75, 0.24, 80, 16);
            const jewMat = new THREE.MeshStandardMaterial({
                color: 0xF59E0B,
                metalness: 0.9,
                roughness: 0.2,
                emissive: 0x78350F,
                emissiveIntensity: 0.25
            });
            jewelryMesh = new THREE.Mesh(jewGeo, jewMat);
            jewelryMesh.position.set(-2, 0, 0);
            jewelryMesh.scale.set(0.7, 0.7, 0.1); // 初始扁平
            groupScene1.add(jewelryMesh);

            // 門縫結構
            const doorMat = new THREE.MeshBasicMaterial({ color: 0xF43F5E });
            const doorTop = new THREE.Mesh(new THREE.BoxGeometry(0.25, 5, 0.25), doorMat);
            doorTop.position.set(2.2, 3.2, 0);
            const doorBottom = new THREE.Mesh(new THREE.BoxGeometry(0.25, 5, 0.25), doorMat);
            doorBottom.position.set(2.2, -3.2, 0);
            doorFrame = new THREE.Group();
            doorFrame.add(doorTop);
            doorFrame.add(doorBottom);
            groupScene1.add(doorFrame);

            // 碰撞火花粒子
            const pCount = 300;
            const pGeo = new THREE.BufferGeometry();
            const pPos = new Float32Array(pCount * 3);
            for(let i=0; i<pCount*3; i+=3) {
                pPos[i] = 2.2 + (Math.random() - 0.5) * 0.6;
                pPos[i+1] = (Math.random() - 0.5) * 2;
                pPos[i+2] = (Math.random() - 0.5) * 1.5;
            }
            pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
            const pMat = new THREE.PointsMaterial({ color: 0xFDE68A, size: 0.1, transparent: true, opacity: 0 });
            particleSystem1 = new THREE.Points(pGeo, pMat);
            groupScene1.add(particleSystem1);
        }

        /* -------------------------------------------------------------
           場景二：時空博物館
        ------------------------------------------------------------- */
        function buildScene2() {
            // 黑曜石鏡面地板
            const floorGeo = new THREE.PlaneGeometry(36, 36);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x050811, roughness: 0.15, metalness: 0.85 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -3.8;
            groupScene2.add(floor);

            // 兩座全息光柱
            const pLight1 = new THREE.PointLight(0x38BDF8, 3, 20);
            pLight1.position.set(-4.5, 6, 0);
            groupScene2.add(pLight1);

            const pLight2 = new THREE.PointLight(0x34D399, 3, 20);
            pLight2.position.set(4.5, 6, 0);
            groupScene2.add(pLight2);

            // 懸浮時空微縮箱 A
            const boxGeo = new THREE.BoxGeometry(3.6, 3.6, 3.6);
            const boxMatA = new THREE.MeshStandardMaterial({
                color: 0x1E293B,
                roughness: 0.2,
                metalness: 0.5,
                wireframe: true
            });
            dioramaA = new THREE.Mesh(boxGeo, boxMatA);
            dioramaA.position.set(-4.5, 0, 0);
            groupScene2.add(dioramaA);

            const cityMesh = new THREE.Mesh(
                new THREE.BoxGeometry(1.4, 2.4, 1.4),
                new THREE.MeshStandardMaterial({ color: 0xF87171, metalness: 0.4 })
            );
            cityMesh.position.set(-4.5, -0.6, 0);
            groupScene2.add(cityMesh);

            // 懸浮時空微縮箱 B
            const boxMatB = new THREE.MeshStandardMaterial({
                color: 0x064E3B,
                roughness: 0.2,
                metalness: 0.5,
                wireframe: true
            });
            dioramaB = new THREE.Mesh(boxGeo, boxMatB);
            dioramaB.position.set(4.5, 0, 0);
            groupScene2.add(dioramaB);

            const treeMesh = new THREE.Mesh(
                new THREE.DodecahedronGeometry(1.2),
                new THREE.MeshStandardMaterial({ color: 0x34D399, wireframe: false, roughness: 0.3 })
            );
            treeMesh.position.set(4.5, 0, 0);
            groupScene2.add(treeMesh);

            // 雨滴粒子 (子彈時間)
            const rCount = 800;
            const rGeo = new THREE.BufferGeometry();
            const rPos = new Float32Array(rCount * 3);
            for(let i=0; i<rCount*3; i+=3) {
                rPos[i] = -4.5 + (Math.random() - 0.5) * 3.4;
                rPos[i+1] = (Math.random() - 0.5) * 3.4;
                rPos[i+2] = (Math.random() - 0.5) * 3.4;
            }
            rGeo.setAttribute('position', new THREE.BufferAttribute(rPos, 3));
            const rMat = new THREE.PointsMaterial({ color: 0x93C5FD, size: 0.06, transparent: true, opacity: 0.9 });
            rainParticles = new THREE.Points(rGeo, rMat);
            groupScene2.add(rainParticles);

            // 星雲粒子流
            const sCount = 2000;
            const sGeo = new THREE.BufferGeometry();
            const sPos = new Float32Array(sCount * 3);
            for(let i=0; i<sCount*3; i+=3) {
                const r = 5 + Math.random() * 9;
                const theta = Math.random() * Math.PI * 2;
                sPos[i] = Math.cos(theta) * r;
                sPos[i+1] = (Math.random() - 0.5) * 8;
                sPos[i+2] = Math.sin(theta) * r;
            }
            sGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
            const sMat = new THREE.PointsMaterial({ color: 0x38BDF8, size: 0.045, transparent: true, opacity: 0.6 });
            swarmParticles = new THREE.Points(sGeo, sMat);
            groupScene2.add(swarmParticles);
        }

        /* -------------------------------------------------------------
           控制面板與互動事件
        ------------------------------------------------------------- */
        function switchScene(id) {
            currentSceneId = id;
            if(id === 1) {
                groupScene1.visible = true;
                groupScene2.visible = false;
                document.getElementById('tab-primary-1').classList.add('active');
                document.getElementById('tab-primary-2').classList.remove('active');
                document.getElementById('controls-scene-1').style.display = 'block';
                document.getElementById('controls-scene-2').style.display = 'none';
                spherical.radius = 14; spherical.theta = 0; spherical.phi = Math.PI / 2;
                updateCameraPosition();
            } else {
                groupScene1.visible = false;
                groupScene2.visible = true;
                document.getElementById('tab-primary-1').classList.remove('active');
                document.getElementById('tab-primary-2').classList.add('active');
                document.getElementById('controls-scene-1').style.display = 'none';
                document.getElementById('controls-scene-2').style.display = 'block';
                spherical.radius = 16; spherical.theta = 0.3; spherical.phi = 1.3;
                updateCameraPosition();
            }
        }

        function onDimensionChange(val) {
            dimProgress = val / 100;
            const label = document.getElementById('label-dimension');
            if(dimProgress === 0) {
                label.innerText = '2D FLAT (無透視)';
                label.style.color = '#94A3B8';
                spherical.theta = 0; spherical.phi = Math.PI / 2;
                updateCameraPosition();
            } else if(dimProgress < 1) {
                label.innerText = `MORPHING: ${(dimProgress*100).toFixed(0)}%`;
                label.style.color = 'var(--accent-cyan)';
            } else {
                label.innerText = '3D FULL PERSPECTIVE';
                label.style.color = 'var(--accent-gold)';
            }

            flatGrid.rotation.x = Math.PI / 2 - (dimProgress * Math.PI / 3.2);
            charMesh.rotation.y = dimProgress * Math.PI * 1.5;
            jewelryMesh.rotation.y = dimProgress * Math.PI * 1.5;
            charMesh.scale.z = 0.05 + dimProgress * 0.95;
            jewelryMesh.scale.z = 0.1 + dimProgress * 0.9;
        }

        function onThicknessChange(val) {
            const scale = 0.5 + (val / 100) * 1.5;
            jewelryMesh.scale.x = scale;
            jewelryMesh.scale.y = scale;
            document.getElementById('label-thickness').innerText = `${(val * 0.1).toFixed(1)} mm`;
        }

        function triggerDoorJam() {
            isJamming = true;
            jamTime = 0;
            charMesh.position.x = 1.4;
            jewelryMesh.position.x = 1.4;
            particleSystem1.material.opacity = 0.95;
        }

        function resetDimension() {
            document.getElementById('slider-dimension').value = 0;
            onDimensionChange(0);
            charMesh.position.set(-2, 0, 0);
            jewelryMesh.position.set(-2, 0, 0);
            particleSystem1.material.opacity = 0;
            isJamming = false;
        }

        function toggleFreezeTime() {
            isTimeFrozen = !isTimeFrozen;
            const btn = document.getElementById('btn-freeze');
            if(isTimeFrozen) {
                btn.innerText = '▶️ 恢復流動 (Resume)';
                btn.style.background = '#10B981';
            } else {
                btn.innerText = '⏸️ 凍結世界 (Bullet Time)';
                btn.style.background = 'linear-gradient(135deg, #0284C7, #38BDF8)';
            }
        }

        function triggerBranchExplode() {
            let scale = 1;
            const interval = setInterval(() => {
                scale += 0.06;
                dioramaB.scale.set(scale, scale, scale);
                if(scale > 1.6) {
                    clearInterval(interval);
                    dioramaB.scale.set(1, 1, 1);
                }
            }, 30);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (!isThreeReady) return;

            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            if(isJamming) {
                jamTime += delta;
                charMesh.position.x = 1.4 + (Math.sin(jamTime * 45) * 0.06);
                jewelryMesh.position.x = 1.4 + (Math.sin(jamTime * 45) * 0.06);
                particleSystem1.rotation.y += 0.08;
                if(jamTime > 2) {
                    isJamming = false;
                    particleSystem1.material.opacity = 0;
                }
            } else {
                jewelryMesh.rotation.x += 0.015;
            }

            if(!isTimeFrozen) {
                dioramaA.rotation.y = time * 0.25;
                dioramaB.rotation.y = -time * 0.25;
                swarmParticles.rotation.y = time * 0.06;
            }

            renderer.render(scene, camera);
        }

        // 啟動檢測
        bootstrap();
    </script>
</body>
</html>
